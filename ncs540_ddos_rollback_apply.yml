---
- name: Roll back DDoS attack mitigation plan on Cisco NCS540 (IOS-XR)
  hosts: iosxr
  gather_facts: no
  collections:
    - cisco.iosxr
    - ansible.netcommon

  tasks:
    - name: Pre-check current prefix-set state
      cisco.iosxr.iosxr_command:
        commands:
          - show running-config prefix-set SCL_INT_OUT_PRI
          - show running-config prefix-set SCL_INT_OUT_SEC
      register: precheck

    - name: Print pre-check output to job log
      ansible.builtin.debug:
        msg:
          - "=== BEFORE ROLLBACK : SCL_INT_OUT_PRI ==="
          - "{{ precheck.stdout[0] | default('') }}"
          - "=== BEFORE ROLLBACK : SCL_INT_OUT_SEC ==="
          - "{{ precheck.stdout[1] | default('') }}"

    - name: Apply rollback plan prefix-set configuration
      cisco.iosxr.iosxr_config:
        src: "{{ playbook_dir }}/ncs540_ddos_rollback_plan.xr"
        match: none
        comment: "DDoS mitigation rollback plan applied by Semaphore"
      register: rollback_result

    - name: Print rollback result
      ansible.builtin.debug:
        var: rollback_result

    - name: Post-check current prefix-set state
      cisco.iosxr.iosxr_command:
        commands:
          - show running-config prefix-set SCL_INT_OUT_PRI
          - show running-config prefix-set SCL_INT_OUT_SEC
      register: postcheck

    - name: Print post-check output to job log
      ansible.builtin.debug:
        msg:
          - "=== AFTER ROLLBACK : SCL_INT_OUT_PRI ==="
          - "{{ postcheck.stdout[0] | default('') }}"
          - "=== AFTER ROLLBACK : SCL_INT_OUT_SEC ==="
          - "{{ postcheck.stdout[1] | default('') }}"
